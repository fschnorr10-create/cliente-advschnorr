<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CLIENTE | Schnorr Advogados Associados (protótipo fictício)</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=Playfair+Display:wght@500;700&display=swap');
:root{--navy:#C9A44A;--gold:#C9A44A;--deep:#8B6914;--bg:#000;--card:#111;--ink:#ece7da;--mut:#a79f8c;--line:#2b2512}
*{box-sizing:border-box}body{margin:0;font:16px/1.6 'IBM Plex Sans',system-ui,Arial,sans-serif;color:var(--ink);background:var(--bg)}
h1,h2,h3{font-family:'Playfair Display',Georgia,serif;font-weight:500}
header{background:#000;border-bottom:1px solid var(--line);padding:14px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px}.brand img{width:150px;height:auto;display:block}.brand span{font-size:12px;letter-spacing:.2em;color:var(--gold);border-left:1px solid var(--line);padding-left:14px}
header a,header button{color:var(--gold);background:none;border:1px solid var(--deep);padding:8px 14px;border-radius:4px;font:14px 'IBM Plex Sans',Arial,sans-serif;cursor:pointer;text-decoration:none}
.banner{background:#1d1704;color:#e4c777;font-size:13px;padding:8px 20px;text-align:center}
nav{display:flex;flex-wrap:wrap;gap:4px 20px;padding:0 20px;background:#080808;border-bottom:1px solid var(--line);overflow-x:auto}
nav a{padding:12px 0;color:var(--mut);text-decoration:none;font-size:14px;white-space:nowrap;border-bottom:2px solid transparent}
nav a.on{color:var(--gold);border-color:var(--gold);font-weight:600}
main{max-width:860px;margin:0 auto;padding:26px 20px 40px}
h1{font-size:30px;color:var(--gold);margin:0 0 4px}h2{font-size:22px;color:var(--gold);margin:0 0 14px}
.sub{color:var(--mut);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px 18px;margin-bottom:12px}
.card h3{margin:0 0 4px;font-size:17px;color:#f1e3b8}.card p{margin:4px 0;color:var(--ink)}
.tag{display:inline-block;font-size:12px;padding:3px 10px;border-radius:99px;border:1px solid var(--deep);color:var(--gold);margin-left:8px;white-space:nowrap;font-family:'IBM Plex Sans',Arial}
.tag.warn{background:#2a2108;color:#f0cf7a}.tag.ok{border-color:#2f5a3c;color:#8fd1a2}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px}.stat b{display:block;font:500 24px 'Playfair Display',Georgia,serif;color:var(--gold)}.stat span{font-size:13px;color:var(--mut)}
label{display:block;font-size:14px;color:var(--mut);margin:10px 0 4px}
input,select,textarea{width:100%;padding:11px;border:1px solid #3a3320;border-radius:6px;font:16px 'IBM Plex Sans',Arial;background:#0b0b0b;color:var(--ink)}
button.p{background:var(--gold);color:#000;border:0;padding:12px 20px;border-radius:6px;font:600 15px 'IBM Plex Sans',Arial;margin-top:12px;cursor:pointer;min-height:44px}
button.s{background:transparent;color:var(--gold);border:1px solid var(--deep);padding:11px 14px;border-radius:6px;font:14px 'IBM Plex Sans',Arial;margin:4px 6px 4px 0;cursor:pointer;min-height:44px}
.note{background:#15110a;border-left:3px solid var(--gold);padding:10px 14px;border-radius:4px;font-size:14px;margin:12px 0;color:var(--ink)}
.login{max-width:420px;margin:30px auto}
footer{text-align:center;font-size:12px;color:var(--mut);padding:24px 20px;border-top:1px solid var(--line)}
.chat p{margin:6px 0}.mail{font-size:14px}
@media(max-width:600px){h1{font-size:24px}main{padding:18px 14px}.brand img{width:120px}.brand span{display:none}}
</style></head><body>

const pend=[['Enviar contrato social atualizado','Quem age: cliente. Prazo: 14/11/2026. Para instruir a consulta nº 3.','Cliente','warn'],['Assinar procuração','Quem age: cliente. Prazo: 16/11/2026. Modelo em Documentos.','Cliente','warn'],['Conferir minuta de resposta à notificação','Quem age: escritório. Previsão: 12/11/2026. Nada a fazer por enquanto.','Escritório','ok']];
const praz=[['Audiência inicial (exemplo)','25/11/2026, 09h40. Presencial. O escritório acompanha; leve documento com foto.','25/11','warn'],['Prazo para recurso (exemplo)','Até 02/12/2026. O escritório prepara; você só aprova o texto.','02/12','warn']];
const cons=[['Consulta 3: rescisão de contrato (exemplo)','03/11/2026, por e-mail. Resposta curta: o desligamento pode seguir, desde que a verba X seja paga até 10 dias após o aviso. Parecer completo em PDF (fictício).','Respondida','ok'],['Consulta 2: banco de horas (exemplo)','21/10/2026, por reunião. Resposta curta: o acordo individual vale se tiver prazo e registro.','Respondida','ok'],['Consulta 1: férias coletivas (exemplo)','08/10/2026, por WhatsApp. Resposta curta: avisar com 15 dias de antecedência.','Respondida','ok']];
const proc=[['Processo 0000000-00.2026.0.00.0000 (fictício)','06/11/2026: sentença publicada, favorável em parte. O escritório analisou e vai recorrer do ponto Y. Há prazo: 02/12. Quem age: escritório.','Há prazo','warn'],['Processo 1111111-11.2026.0.00.0000 (fictício)','04/11/2026: juntada de documentos pela outra parte. Sem prazo para você. O escritório acompanha.','Sem ação','ok']];
const mod=[['Procuração (modelo)','PDF, 2 páginas. Para assinatura do representante legal.'],['Declaração de hipossuficiência (modelo)','PDF, 1 página.'],['Lista de documentos para consulta trabalhista (modelo)','Checklist para organizar o que enviar.'],['Termo de confidencialidade (modelo)','PDF, 3 páginas.']];
const faq={'Como envio um documento?':'Use a aba Dúvidas e anexe o arquivo. O escritório confirma o recebimento.','Onde vejo meus prazos?':'Na aba Prazos. O que depender de você aparece em Pendências, com a data.','Quando o andamento é atualizado?':'A cada 2 horas em horário útil, depois que o jurídico libera. O horário aparece no topo.','Como falo com o escritório?':'Pela aba Dúvidas ou Agendar. Para urgência, ligue ao escritório.'};
const tabs=[['inicio','Início'],['pendencias','Pendências'],['prazos','Prazos'],['consultas','Consultas'],['processos','Processos'],['modelos','Modelos'],['duvidas','Dúvidas'],['agendar','Agendar'],['assistente','Assistente'],['avisos','Aviso por e-mail']];
const card=a=>`<div class="card"><h3>${a[0]}${a[2]?`<span class="tag ${a[3]||''}">${a[2]}</span>`:''}</h3><p>${a[1]}</p></div>`;
let log=[],slot='',sent=false,q='';
const pages={
inicio:()=>`<h1>Olá</h1><p class="sub">${C}</p><div class="grid"><div class="stat"><b>2</b><span>pendências suas</span></div><div class="stat"><b>2</b><span>prazos nos próximos 30 dias</span></div><div class="stat"><b>hoje, 14h00</b><span>última atualização (fictício)</span></div></div><div class="note">O escritório acompanha os seus processos. Mostramos aqui só o que o jurídico já analisou, em linguagem simples.</div>`,
pendencias:()=>`<h2>O que precisamos de você</h2>${pend.map(card).join('')}`,
prazos:()=>`<h2>Prazos e audiências</h2>${praz.map(card).join('')}<button class="s">Adicionar ao calendário do celular</button>`,
consultas:()=>`<h2>Consultas realizadas</h2><label>Buscar nas consultas</label><input id="q" value="${q}" placeholder="ex.: férias">${cons.filter(c=>(c[0]+c[1]).toLowerCase().includes(q.toLowerCase())).map(card).join('')||'<p>Nenhuma consulta encontrada.</p>'}`,
processos:()=>`<h2>Andamento dos processos</h2><div class="note">Só movimentações já analisadas pelo jurídico.</div>${proc.map(card).join('')}`,
modelos:()=>`<h2>Documentos modelo</h2>${mod.map(m=>card([m[0],m[1],'Baixar'])).join('')}`,
duvidas:()=>`<h2>Canal de dúvidas</h2><label>Sobre qual demanda?</label><select><option>Consulta 3: rescisão</option><option>Processo 0000000-00 (fictício)</option><option>Outro assunto</option></select><label>Sua dúvida</label><textarea rows="4" placeholder="Escreva aqui"></textarea><label>Anexar documento</label><input type="file"><button class="p" id="send">Enviar ao jurídico</button>${sent?'<div class="note">Recebido (demonstração). Na versão real o jurídico recebe e a resposta aparece aqui.</div>':''}`,
agendar:()=>`<h2>Agendar reunião</h2><div class="note">Na versão real, os horários vêm da agenda do escritório.</div>${['Seg 16/11, 10h','Ter 17/11, 15h','Qui 19/11, 11h'].map(x=>`<button class="s slot" data-s="${x}" style="${slot==x?'background:#C9A44A;color:#000':''}">${x}</button>`).join('')}${slot?`<div class="note">Pedido para ${slot} registrado (demonstração). O jurídico confirma por aqui.</div>`:''}`,
assistente:()=>`<h2>Assistente do escritório</h2><div class="note">Respostas prontas e aprovadas pelo jurídico, sem IA livre. Assuntos de processo ou pedidos de opinião vão ao jurídico, que responde.</div>${Object.keys(faq).map(k=>`<button class="s faq" data-k="${k}">${k}</button>`).join('')}<label>Outra pergunta</label><input id="t" placeholder="Escreva aqui"><button class="p" id="ask">Enviar</button><div class="card chat">${log.length?log.map(m=>`<p><b>Você:</b> ${m[0]}</p><p><b>Escritório:</b> ${m[1]}</p>`).join(''):'<p>Escolha uma pergunta acima.</p>'}</div>`,
avisos:()=>`<h2>Aviso por e-mail</h2><div class="note">Texto-modelo aguardando aprovação do Dr. Fábio. Nada é enviado.</div><div class="card mail"><p><b>De:</b> Schnorr Advogados Associados</p><p><b>Assunto:</b> Há novidade no seu acompanhamento</p><p>Olá. Há uma novidade no seu acompanhamento jurídico.</p><p>Para ver, entre em CLIENTE: [link do escritório]</p><p>Este aviso não traz detalhes por segurança. O acesso é pessoal e não deve ser compartilhado. Se recebeu por engano, desconsidere e avise o escritório. Para deixar de receber estes avisos, responda esta mensagem.</p></div><div class="card"><p><b>Quando envia:</b> quando o jurídico libera uma atualização, no máximo 1 resumo por dia.</p><p><b>Quem recebe:</b> só pessoas autorizadas por cliente, aprovadas pelo Dr. Fábio.</p><p><b>Dados atualizados:</b> a cada 2h, das 7h às 19h, com horário visível.</p></div>`};
let logged=false,step=0,email='';
function render(){const app=document.getElementById('app'),out=document.getElementById('out');out.hidden=!logged;
if(!logged){app.innerHTML=`<main class="login card"><h2>Entrar</h2>`+(step==0?`<label>E-mail cadastrado pelo escritório</label><input id="em" placeholder="nome@empresa-ficticia.com.br"><button class="p" id="go">Receber código por e-mail</button>`:`<p>Enviaríamos um código de 6 dígitos para ${email||'o seu e-mail'}. Cada pessoa tem acesso individual, só aos dados do seu cliente.</p><label>Código</label><input inputmode="numeric" placeholder="123456"><button class="p" id="in">Entrar</button>`)+`<div class="note">Demonstração: aceita qualquer e-mail e código.</div></main>`;
const g=document.getElementById('go');if(g)g.onclick=()=>{email=document.getElementById('em').value;step=1;render()};const i=document.getElementById('in');if(i)i.onclick=()=>{logged=true;location.hash='inicio';render()};return}
const p=(location.hash.slice(1)||'inicio');const k=pages[p]?p:'inicio';
app.innerHTML=`<nav>${tabs.map(t=>`<a href="#${t[0]}" class="${t[0]==k?'on':''}">${t[1]}</a>`).join('')}</nav><main>${pages[k]()}</main>`;
const qq=document.getElementById('q');if(qq)qq.oninput=e=>{q=e.target.value;render();const n=document.getElementById('q');n.focus();n.setSelectionRange(q.length,q.length)};
const sd=document.getElementById('send');if(sd)sd.onclick=()=>{sent=true;render()};
document.querySelectorAll('.slot').forEach(b=>b.onclick=()=>{slot=b.dataset.s;render()});
document.querySelectorAll('.faq').forEach(b=>b.onclick=()=>{log.push([b.dataset.k,faq[b.dataset.k]]);render()});
const ak=document.getElementById('ask');if(ak)ak.onclick=()=>{const v=document.getElementById('t').value.trim();if(v){log.push([v,'Não respondo sobre processos nem dou orientação jurídica. Encaminhei sua pergunta ao jurídico (demonstração). Resposta em até 1 dia útil, aqui na área.']);render()}};}
document.getElementById('out').onclick=()=>{logged=false;step=0;render()};

window.onhashchange=()=>{if(logged)render()};
if(location.search.includes('demo')){logged=true;sent=location.search.includes('sent');if(location.search.includes('chat'))log=[['Como envio um documento?',faq['Como envio um documento?']],['Qual a chance de ganhar meu processo?','Não respondo sobre processos nem dou orientação jurídica. Encaminhei sua pergunta ao jurídico (demonstração). Resposta em até 1 dia útil, aqui na área.']]}
render();
</script></body></html>
